<!DOCTYPE html>
<html>
<head>
    <title>Test OdooFreeTrial Form Submission</title>
    <script>
        async function testFormSubmission() {
            const payload = {
                name: "Test User - Live Test",
                email: "test-live@example.com",
                phone: "+971501234567",
                company: "Test Company Ltd",
                server_location: "meppel",  // Testing with lowercase meppel
                send_confirmation: true,
                timestamp: new Date().toISOString()
            };

            console.log("Sending to webhook:", payload);
            document.getElementById("request").textContent = JSON.stringify(payload, null, 2);

            try {
                const response = await fetch("https://002-001-5dd6e535-4d1c-46bc-9bd9-42ad4bc5f082.odoo4projects.com/webhook/47129739-e60b-4944-b6c2-d3fd5ce0991b", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(payload)
                });

                document.getElementById("status").textContent = `Status: ${response.status}`;
                
                const responseText = await response.text();
                document.getElementById("response").textContent = responseText;

                if (response.ok) {
                    document.getElementById("result").innerHTML = "✅ SUCCESS - Form submitted!";
                    document.getElementById("result").style.color = "green";
                } else {
                    document.getElementById("result").innerHTML = `⚠️  Non-2xx Status (${response.status})`;
                    document.getElementById("result").style.color = "orange";
                }
            } catch (error) {
                document.getElementById("result").innerHTML = `❌ ERROR: ${error.message}`;
                document.getElementById("result").style.color = "red";
                document.getElementById("response").textContent = error.stack;
            }
        }
    </script>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto;">
    <h1>OdooFreeTrial Form - Live Test</h1>
    <p>This test sends a payload directly to the Odoo4Projects webhook with <code>server_location: "meppel"</code> (lowercase).</p>
    
    <button onclick="testFormSubmission()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        🚀 Test Form Submission
    </button>

    <div style="margin-top: 20px;">
        <h2 id="result">Ready to test...</h2>
        <h3 id="status"></h3>
    </div>

    <div style="margin-top: 20px;">
        <h3>Request Payload:</h3>
        <pre id="request" style="background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto;"></pre>
    </div>

    <div style="margin-top: 20px;">
        <h3>Response:</h3>
        <pre id="response" style="background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto;"></pre>
    </div>
</body>
</html>
